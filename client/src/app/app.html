<div class="card bg-base-100 w-1/2 mx-auto p-10 mt-10  shadow-sm">
    <h3 class="text-3xl text-red-500">{{title()}}</h3>
    <ul class="list">
  @for (m1 of member(); track m1.id) {
    <li class="list-row items-center">
        <img src ='/user.png' alt="user cards"  class="size-12 rounded-box" >
        <div>
            {{m1.displayName}}
        </div>
    </li>
  }
</ul>

</div>
